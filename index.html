<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhya AI Companion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #16213e;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header h2 {
            margin: 0;
            color: #e94560;
        }
        .chat-box {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #0f3460;
            padding: 10px;
            border-radius: 10px;
            background: #0f3460;
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
        }
        .user-message {
            background: #e94560;
            margin-left: auto;
            text-align: right;
        }
        .ai-message {
            background: #533483;
            margin-right: auto;
        }
        .input-box {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>❤️ आध्या (Aadhya AI)</h2>
        <small>आपकी अपनी AI साथी</small>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">
            नमस्ते बॉस! मैं आध्या हूँ। बताइए आज अपनी आध्या से क्या काम करवाना है? 💕
        </div>
    </div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="यहाँ मैसेज लिखें या बात करें...">
        <button onclick="sendMessage()">भेजें</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        const chatBox = document.getElementById('chatBox');
        
        // User Message
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.innerText = text;
        chatBox.appendChild(userDiv);

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // AI Reply Demo
        setTimeout(() => {
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerText = "हाँ जी बॉस! मैं आपकी बात समझ गई। 💕";
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            speak("हाँ जी बॉस! मैं आपकी बात समझ गई।");
        }, 1000);
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hi-IN';
            window.speechSynthesis.speak(msg);
        }
    }
</script>

</body>
  </html>
