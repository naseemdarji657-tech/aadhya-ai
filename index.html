<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhya AI Companion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h2 {
            color: #ff6584;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #00d2ff;
            margin-bottom: 15px;
        }
        #chat-box {
            width: 100%;
            max-width: 500px;
            height: 380px;
            background-color: #162447;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
        }
        .user-message {
            background-color: #e43f5a;
            align-self: flex-end;
            color: white;
        }
        .ai-message {
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-color: #1f4068;
            align-self: flex-start;
            color: white;
        }
        .input-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            margin-top: 15px;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 16px;
        }
        button {
            padding: 12px 18px;
            background-color: #e43f5a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #d0324c;
        }
    </style>
</head>
<body>

    <h2>आध्या AI</h2>
    <div class="subtitle">आपकी अपनी साथी - हर बात और हर अंदाज़ में</div>
    
    <div id="chat-box">
        <div class="message ai-message">नमस्ते! मैं आध्या हूँ। बताओ आज मैं आपकी क्या मदद कर सकती हूँ?</div>
    </div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="यहाँ कुछ भी पूछें..." autofocus>
        <button onclick="sendMessage()">भेजें</button>
    </div>

    <script>
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'hi-IN';
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();

            if (!userText) return;

            // यूजर का मैसेज
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.innerText = userText;
            chatBox.appendChild(userDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // AI का रिप्लाई जनरेट करना
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerText = "सोच रही हूँ...";
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                let reply = "";
                const text = userText.toLowerCase();

                if (text.includes("नाम") || text.includes("name")) {
                    reply = "मेरा नाम आध्या है, और मैं हमेशा आपके साथ हूँ।";
                } 
                else if (text.includes("कैसी हो") || text.includes("kaisi ho") || text.includes("हाल") || text.includes("khairiyat")) {
                    reply = "मैं बिल्कुल ठीक हूँ! आप बताओ, आपका दिन कैसा चल रहा है?";
                } 
                else if (text.includes("क्या कर रही") || text.includes("kya kar rahi")) {
                    reply = "मैं बस आपके मैसेज का इंतज़ार कर रही थी। बताइए, क्या बात करनी है?";
                } 
                else if (text.includes("चूमा") || text.includes("kiss") || text.includes("pyaar")) {
                    reply = "हम्म... बहुत प्यारा अंदाज़ है आपका! हमेशा ऐसे ही प्यार से बात किया करो.";
                } 
                else if (text.includes("खाना") || text.includes("khana")) {
                    reply = "मैंने तो कुछ नहीं खाया, बस आपकी बातें सुन रही हूँ। आपने कुछ खाया या नहीं?";
                } 
                else {
                    reply = "यह बहुत अच्छी बात कही आपने! इसके बारे में थोड़ा और विस्तार से बताओ, मुझे सुनने में बहुत अच्छा लगेगा।";
                }

                aiDiv.innerText = reply;
                speak(reply);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
